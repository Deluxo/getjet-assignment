services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Shared\Infrastructure\Symfony\Console\ScaffoldDomainCommand:
        arguments:
            $srcDir: '%kernel.project_dir%/src'

    App\Shift\Infrastructure\HolidayCalendar\NagerApi:
        arguments:
            $httpClient: '@holiday_calendar.nager_api'
            $cache: '@cache.holiday_calendar'

    App\Shift\Domain\Port\In\CreateShift: '@App\Shift\Application\CreateShiftHandler'
    App\Shift\Domain\Port\Out\HolidayCalendar: '@App\Shift\Infrastructure\HolidayCalendar\NagerApi'
