services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Shared\Infrastructure\Symfony\Console\ScaffoldDomainCommand:
        arguments:
            $srcDir: '%kernel.project_dir%/src'

    App\Shift\Domain\Port\In\CreateShift: '@App\Shift\Application\CreateShiftHandler'
